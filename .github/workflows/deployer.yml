# À placer dans le dépôt : .github/workflows/deployer.yml
# Met le site en ligne UNIQUEMENT quand tu cliques sur « Run workflow »
# (onglet Actions > Déployer le site). Les commits ne déploient plus rien tout seuls.
# Prérequis : Settings > Pages > Build and deployment > Source = « GitHub Actions ».
name: Déployer le site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read
# Un seul déploiement à la fois : un nouveau clic annule celui en cours (fini les erreurs « in progress deployment »)
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4
      - name: Rassembler les fichiers du site (rien d'autre n'est publié)
        run: |
          mkdir _site
          cp -r index.html supabase.js manifest.webmanifest img _site/
          if [ -f mock-supabase.js ]; then cp mock-supabase.js _site/; fi
          touch _site/.nojekyll
          echo "Fichiers publiés :"; ls -R _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Débloquer un ancien déploiement resté « en cours »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=15" --jq '.[].sha' | sort -u); do
            if gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1; then echo "Annulé : $sha"; fi
          done
          sleep 5
      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
