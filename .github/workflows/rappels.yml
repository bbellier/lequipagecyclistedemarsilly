# À placer dans le dépôt : .github/workflows/rappels.yml
# Chaque matin : envoie un rappel par e-mail aux membres qui ont répondu « Je viens »,
# 10 jours (J-10) et 1 jour (J-1) avant l'évènement, puis un BILAN (participants, résultats,
# photos) à tous les membres 2 jours après la fin de l'évènement. Chaque e-mail n'est envoyé qu'une fois.
# Elle tourne toutes les 15 minutes pour traiter aussi les envois demandés depuis l'app (bouton « Envoyer un e-mail »
# du bureau, table envois) ; les rappels et bilans automatiques ne partent qu'à partir de 7 h (heure de Paris).
# Cette tâche garde aussi la base Supabase éveillée (le fichier supabase-reveil.yml devient inutile).
#
# Secrets à créer dans GitHub > Settings > Secrets and variables > Actions :
#   SUPABASE_URL         https://xxxx.supabase.co
#   SUPABASE_SECRET_KEY  clé secrète Supabase (Project Settings > API Keys > Secret keys, sb_secret_...)
#   GMAIL_USER           adresse Gmail qui envoie (ex. lequipagecycliste@gmail.com)
#   GMAIL_APP_PASSWORD   mot de passe d'application de cette adresse (16 lettres, sans espaces)
#   APP_URL              adresse de l'app (ex. https://bbellier.github.io/equipage/)
name: Rappels e-mail
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # toutes les 15 minutes (envois demandés depuis l'app) ; automatiques à partir de 7 h
  workflow_dispatch:
    inputs:
      test:
        description: "Mode test : affiche les e-mails sans les envoyer (oui/non)"
        default: "non"
      essai:
        description: "Essai : oui = envoie le bilan et le rappel du DERNIER évènement à l'adresse ci-dessous seulement"
        default: "non"
      essai_email:
        description: "Essai : adresse qui reçoit (vide = l'adresse Gmail du club)"
        default: ""
jobs:
  rappels:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer les rappels J-10, J-1 et les bilans
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
          TEST: ${{ github.event.inputs.test }}
          ESSAI: ${{ github.event.inputs.essai }}
          ESSAI_EMAIL: ${{ github.event.inputs.essai_email }}
        run: |
          python3 - <<'PY'
          import os, json, smtplib, urllib.request, urllib.parse, html, re
          from datetime import date, datetime, timedelta
          from email.message import EmailMessage
          from zoneinfo import ZoneInfo

          URL = os.environ["SUPABASE_URL"].rstrip("/"); KEY = os.environ["SUPABASE_KEY"]
          APP = os.environ.get("APP_URL") or ""; TEST = (os.environ.get("TEST") or "non").lower() == "oui"
          CLUB = "L'Équipage Cycliste de Marsilly"
          H = {"apikey": KEY, "Content-Type": "application/json"}
          if not KEY.startswith("sb_"): H["Authorization"] = "Bearer " + KEY   # anciennes clés service_role (JWT)

          def api(chemin, methode="GET", corps=None, entetes=None):
              req = urllib.request.Request(f"{URL}/rest/v1/{chemin}", method=methode, headers={**H, **(entetes or {})},
                                           data=json.dumps(corps).encode() if corps is not None else None)
              with urllib.request.urlopen(req, timeout=30) as r:
                  t = r.read().decode(); return json.loads(t) if t else None

          auj = datetime.now(ZoneInfo("Europe/Paris")).date()
          cibles = {"J-10": auj + timedelta(days=10), "J-1": auj + timedelta(days=1)}
          deja = {(r["evenement_id"], r["membre_id"], r["type"]) for r in api("rappels_envoyes?select=evenement_id,membre_id,type")}
          membres = {m["id"]: m for m in api("membres?select=id,prenom,email,actif")}
          sans_rappel = {p["membre_id"] for p in api("profils?select=membre_id,rappels&rappels=eq.false")}
          sans_bilan = {p["membre_id"] for p in api("profils?select=membre_id,bilans&bilans=eq.false")}
          JOURS_BILAN = 2   # le bilan part 2 jours après la fin de l'évènement, pour laisser le temps de saisir les résultats
          mois = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"]
          jours_sem = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"]
          def fr(d): d = date.fromisoformat(d); return f"{jours_sem[d.weekday()]} {d.day} {mois[d.month-1]} {d.year}"
          def hr(h):
              if not h: return ""
              a, b = h.split(":")[:2]; return f"{int(a)} h" + (f" {b}" if b != "00" else "")
          def lib_parcours(p):
              dist = (f"format {'XXL (Ironman)' if p.get('format') == 'XXL' else p['format']}" if p.get("discipline") == "triathlon" and p.get("format")
                      else (f"{round(float(p.get('km') or p.get('gpx_km')), 1):g} km".replace(".", ",") if (p.get("km") or p.get("gpx_km")) else ""))
              return " · ".join(x for x in [p.get("nom"), dist, f"départ {hr(p['heure_depart'])}" if p.get("heure_depart") else ""] if x)

          a_envoyer = []
          for type_, jour in cibles.items():
              evts = api(f"evenements?select=*&date_debut=eq.{jour.isoformat()}")
              for e in evts:
                  e["_parcours"] = api(f"parcours?select=*&evenement_id=eq.{e['id']}&order=ordre")
                  parts = api(f"participations?select=membre_id&evenement_id=eq.{e['id']}&reponse=eq.true")
                  for p in parts:
                      m = membres.get(p["membre_id"])
                      if not m or not m["actif"] or m["id"] in sans_rappel or (e["id"], m["id"], type_) in deja: continue
                      a_envoyer.append((type_, e, m))

          # Bilans : évènements terminés il y a JOURS_BILAN jours, avec au moins un participant ou un résultat
          fin_bilan = (auj - timedelta(days=JOURS_BILAN)).isoformat()
          for e in api(f"evenements?select=*&date_fin=eq.{fin_bilan}"):
              e["_parcours"] = api(f"parcours?select=*&evenement_id=eq.{e['id']}&order=ordre")
              e["_venus"] = [p["membre_id"] for p in api(f"participations?select=membre_id&evenement_id=eq.{e['id']}&reponse=eq.true")]
              e["_res"] = api(f"resultats?select=*&evenement_id=eq.{e['id']}")
              e["_photos"] = len(api(f"medias?select=id&evenement_id=eq.{e['id']}"))
              if not e["_venus"] and not e["_res"]: continue
              for m in membres.values():
                  if not m["actif"] or m["id"] in sans_bilan or (e["id"], m["id"], "bilan") in deja: continue
                  a_envoyer.append(("bilan", e, m))
          a_envoyer = [x for x in a_envoyer if x[2].get("email")]   # membres sans e-mail : rien à envoyer
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule" and datetime.now(ZoneInfo("Europe/Paris")).hour < 7: a_envoyer = []

          # Envois demandés depuis l'app par le bureau (table envois)
          def charger(e):
              e["_parcours"] = api(f"parcours?select=*&evenement_id=eq.{e['id']}&order=ordre")
              e["_venus"] = [p["membre_id"] for p in api(f"participations?select=membre_id&evenement_id=eq.{e['id']}&reponse=eq.true")]
              e["_res"] = api(f"resultats?select=*&evenement_id=eq.{e['id']}")
              e["_photos"] = len(api(f"medias?select=id&evenement_id=eq.{e['id']}"))
          maintenant = lambda: datetime.now(ZoneInfo("UTC")).isoformat()
          demandes = []
          try: demandes = api("envois?select=*&statut=eq.en_attente&order=id") or []
          except Exception as err: print("Envois à la demande indisponibles (migration v15 ?) :", err)
          for d in demandes:
              ev = api(f"evenements?select=*&id=eq.{d['evenement_id']}")
              if not ev: d["_liste"] = []; d["_err"] = "évènement introuvable"; continue
              e = ev[0]; charger(e); t = d["type"]
              if d["cible"] == "moi": dest = [membres.get(d.get("demande_par"))]
              elif d["cible"] == "participants": dest = [membres.get(i) for i in sorted(set(e["_venus"]) | ({r["membre_id"] for r in e["_res"]} if t == "bilan" else set()))]
              else: dest = [m for m in membres.values() if m["actif"] and m["id"] not in (sans_bilan if t == "bilan" else sans_rappel)]
              d["_liste"] = [(t, e, m) for m in dest if m and m.get("email")]
              print(f"Demande n° {d['id']} : {t} « {e['evenement']} » → {d['cible']} ({len(d['_liste'])} destinataire(s))")
          print(f"{auj} : {len(a_envoyer)} e-mail(s) à envoyer")

          def secondes(t):
              try: return sum(int(x) * 60 ** i for i, x in enumerate(reversed(t.split(":"))))
              except Exception: return 10 ** 9
          def bilan(e, m):
              parc = {p["id"]: p for p in e.get("_parcours") or []}
              res = sorted(e["_res"], key=lambda r: (bool(r.get("abandon")), secondes(r.get("temps") or ""), r.get("place") or 10 ** 6))
              venus = set(e["_venus"]) | {r["membre_id"] for r in res}
              noms = sorted(membres[i]["prenom"] for i in venus if i in membres)
              lignes = [f"Salut {m['prenom']},", "", f"Bilan de {e['evenement']} ({fr(e['date_debut'])}" + (f", {e['lieu']}" if e.get("lieu") else "") + ") :", "",
                        f"{len(venus)} membre{'s' if len(venus) > 1 else ''} du club : {', '.join(noms)}."]
              if res:
                  lignes += ["", "Résultats :"]
                  for r in res:
                      qui = membres.get(r["membre_id"], {}).get("prenom", "?")
                      p = parc.get(r.get("parcours_id"))
                      morceaux = [r.get("temps"), (f"{r['place']}{'er' if r['place'] == 1 else 'e'}" + (f" / {r['partants']}" if r.get("partants") else "")) if r.get("place") else None,
                                  lib_parcours({**p, "heure_depart": None}) if p else (f"{r['km']:g} km" if r.get("km") else r.get("format")), "abandon" if r.get("abandon") else None]
                      lignes.append(f"  • {qui} : " + " · ".join(str(x) for x in morceaux if x))
              else:
                  lignes += ["", "Pas encore de résultats saisis : ajoute le tien dans l'app."]
              if e.get("lien_resultats"): lignes += ["", f"Résultats officiels : {e['lien_resultats']}"]
              if e["_photos"]: lignes += ["", f"{e['_photos']} photo{'s' if e['_photos'] > 1 else ''} et vidéo{'s' if e['_photos'] > 1 else ''} à voir dans l'app."]
              if APP: lignes += ["", f"Tout le détail dans l'app, onglet Résultats : {APP}"]
              lignes += ["", "Bravo à tous,", CLUB, "", "Pour ne plus recevoir ces bilans : app > Profil > décocher le bilan par e-mail."]
              return lignes

          def message(type_, e, m):
              if type_ == "bilan": return emballer(f"Bilan · {e['evenement']}", e['evenement'], bilan(e, m), m, "Bilan de l'évènement")
              n = (date.fromisoformat(e["date_debut"]) - auj).days if e.get("date_debut") else None
              quand = "dans 10 jours" if type_ == "J-10" else "demain" if type_ == "J-1" or n == 1 else "aujourd'hui" if n == 0 else f"dans {n} jours" if n and n > 1 else "bientôt"
              lignes = [f"Salut {m['prenom']},", "", f"Petit rappel : {e['evenement']}, c'est {quand}, le {fr(e['date_debut'])}."]
              if e.get("heure_depart"): lignes.append(f"Départ : {hr(e['heure_depart'])}")
              if e.get("lieu"): lignes.append(f"Lieu : {e['lieu']}")
              for p in e.get("_parcours") or []: lignes.append(f"Parcours : {lib_parcours(p)}")
              if e.get("tarif"): lignes.append(f"Tarif : {e['tarif']}")
              if type_ == "J-10" and e.get("lien") and (not e.get("inscription_fermeture") or e["inscription_fermeture"] >= auj.isoformat()):
                  fin = f" avant le {fr(e['inscription_fermeture'])}" if e.get("inscription_fermeture") else ""
                  lignes += ["", f"Pense à t'inscrire auprès de l'organisateur{fin} : {e['lien']}"]
              if e.get("commentaires"): lignes += ["", e["commentaires"]]
              if APP: lignes += ["", f"La fiche dans l'app : {APP}"]
              lignes += ["", "À bientôt sur la route,", CLUB, "", "Pour ne plus recevoir ces rappels : app > Profil > décocher les rappels par e-mail."]
              return emballer(f"{'J-10' if type_=='J-10' else 'Demain' if quand == 'demain' else 'Rappel'} · {e['evenement']}", e['evenement'], lignes, m, f"Rappel · c'est {quand}" if type_ != "J-10" else "Rappel · dans 10 jours")

          def emballer(sujet, titre, lignes, m, surtitre=""):
              # Mise en page aux couleurs du club : bandeau noir + logo, filet rouge, papier, croix rouges
              msg = EmailMessage()
              msg["Subject"] = sujet
              msg["From"] = f"{CLUB} <{os.environ.get('GMAIL_USER','')}>"; msg["To"] = m["email"]
              msg.set_content("\n".join(lignes))
              pied = [l for l in lignes if l.startswith("Pour ne plus")]
              corps_l = [l for l in lignes if l not in pied]
              while corps_l and not corps_l[-1]: corps_l.pop()
              def ligne(l):
                  t = html.escape(l)
                  t = re.sub(r"(https?://[^\s<]+)", r"<a href='\1' style='color:#c8102e;font-weight:bold'>\1</a>", t)
                  if l.startswith("  • "): return f"<p style='margin:2px 0 2px 6px;padding:6px 10px;background:#f1ebe0;border-left:3px solid #c8102e;border-radius:4px'>{t[4:]}</p>"
                  if l.rstrip().endswith(":") and len(l) < 32: return f"<p style='margin:14px 0 4px;font:bold 12px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#c8102e'>&#10005; {t.rstrip(' :')}</p>"
                  return f"<p style='margin:6px 0'>{t}</p>" if l else "<div style='height:6px'></div>"
              corps = "".join(ligne(l) for l in corps_l)
              logo = (APP.rstrip("/") + "/img/logo-blanc.png") if APP else ""
              bouton = f"<tr><td style='padding:4px 24px 24px'><a href='{html.escape(APP)}' style='display:inline-block;background:#161514;color:#f4efe6;padding:12px 22px;border-radius:8px;text-decoration:none;font:bold 14px Arial,sans-serif;letter-spacing:1px;text-transform:uppercase'>Ouvrir l'app du club</a></td></tr>" if APP else ""
              page = f"""<div style='background:#e9e2d5;padding:24px 10px;font-family:Arial,Helvetica,sans-serif'>
          <table role='presentation' cellpadding='0' cellspacing='0' width='100%' style='max-width:580px;margin:0 auto;border-collapse:collapse;background:#fbf8f2;border:1px solid #d6cdbd'>
          <tr><td style='background:#161514;padding:20px;text-align:center'>{f"<img src='{logo}' width='76' height='76' alt='' style='display:block;margin:0 auto 10px;border:0'>" if logo else ""}<div style='color:#f4efe6;font:bold 13px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase'>{html.escape(CLUB)}</div></td></tr>
          <tr><td style='height:5px;line-height:5px;font-size:0;background:#c8102e'>&nbsp;</td></tr>
          <tr><td style='padding:24px 24px 4px'>{f"<div style='color:#c8102e;font:bold 12px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase'>&#10005; {html.escape(surtitre)}</div>" if surtitre else ""}<h1 style='margin:6px 0 0;font:bold 26px "Arial Narrow",Arial,sans-serif;text-transform:uppercase;color:#161514;line-height:1.15'>{html.escape(titre)}</h1></td></tr>
          <tr><td style='padding:10px 24px 14px;font-size:15px;line-height:1.5;color:#161514'>{corps}</td></tr>
          {bouton}
          <tr><td style='background:#161514;padding:14px 20px;text-align:center;color:#a39d93;font-size:12px;line-height:1.5'><span style='color:#c8102e;letter-spacing:6px'>&#10005;&#10005;&#10005;</span><br>{html.escape(pied[0]) if pied else html.escape(CLUB)}</td></tr>
          </table></div>"""
              msg.add_alternative(page, subtype="html")
              return msg

          # Essai : bilan + rappel d'un évènement envoyés à une seule adresse, sans rien enregistrer
          ESSAI = (os.environ.get("ESSAI") or "non").strip().lower() == "oui"
          if ESSAI:
              ev = api(f"evenements?select=*&date_fin=lte.{auj.isoformat()}&order=date_fin.desc,id.desc&limit=1")
              if not ev: print("Essai : aucun évènement passé trouvé"); raise SystemExit(1)
              e = ev[0]
              e["_parcours"] = api(f"parcours?select=*&evenement_id=eq.{e['id']}&order=ordre")
              e["_venus"] = [p["membre_id"] for p in api(f"participations?select=membre_id&evenement_id=eq.{e['id']}&reponse=eq.true")]
              e["_res"] = api(f"resultats?select=*&evenement_id=eq.{e['id']}")
              e["_photos"] = len(api(f"medias?select=id&evenement_id=eq.{e['id']}"))
              dest = (os.environ.get("ESSAI_EMAIL") or os.environ.get("GMAIL_USER") or "").strip()
              m0 = next((x for x in membres.values() if (x.get("email") or "").lower() == dest.lower()), None) or {"id": 0, "prenom": "Test", "actif": True}
              m = {**m0, "email": dest}
              a_envoyer = [("bilan", e, m), ("J-1", e, m)]
              print(f"Essai : « {e['evenement']} » ({e.get('date_fin')}) → {dest}")

          if ESSAI: demandes = []
          if not a_envoyer and not demandes: raise SystemExit(0)
          if TEST:
              for t, e, m in a_envoyer + [x for d in demandes for x in d["_liste"]]: print("---", t, m["email"]); print(message(t, e, m).get_body(("plain",)).get_content())
              raise SystemExit(0)
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"].replace(" ", ""))
              for t, e, m in a_envoyer:
                  try:
                      msg = message(t, e, m)
                      if ESSAI:
                          sujet = msg["Subject"]; del msg["Subject"]; msg["Subject"] = "[Essai] " + sujet
                          s.send_message(msg); print("essai envoyé :", t, "→", m["email"]); continue
                      s.send_message(msg)
                      api("rappels_envoyes", "POST", {"evenement_id": e["id"], "membre_id": m["id"], "type": t}, {"Prefer": "resolution=ignore-duplicates"})
                      print("envoyé :", t, e["evenement"], "→", m["prenom"])
                  except Exception as err:
                      print("échec :", m["email"], err)
              for d in demandes:
                  nb, echecs = 0, []
                  for t, e, m in d["_liste"]:
                      try:
                          msg = message(t, e, m)
                          if d["cible"] == "moi": sujet = msg["Subject"]; del msg["Subject"]; msg["Subject"] = "[Test] " + sujet
                          s.send_message(msg); nb += 1
                          if t == "bilan" and d["cible"] != "moi":
                              api("rappels_envoyes", "POST", {"evenement_id": e["id"], "membre_id": m["id"], "type": "bilan"}, {"Prefer": "resolution=ignore-duplicates"})
                      except Exception as err: echecs.append(m.get("prenom", "?")); print("échec :", m["email"], err)
                  err = d.get("_err") or (f"échec pour {', '.join(echecs)}" if echecs else None)
                  api(f"envois?id=eq.{d['id']}", "PATCH", {"statut": "erreur" if (err and not nb) else "envoye", "nb": nb, "detail": err, "traite_le": maintenant()})
                  print(f"Demande n° {d['id']} traitée : {nb} e-mail(s)")
          PY
